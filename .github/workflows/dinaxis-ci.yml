name: Dinaxis CI

# ── Trigger ───────────────────────────────────────────────────────────────────
# Runs only on pushes to main that touch files inside dinaxis/
on:
  push:
    branches:
      - main
    paths:
      - 'dinaxis/**'
      - 'scripts/update-nginx.sh'

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Type-check backend ──────────────────────────────────────────────────
  typecheck-backend:
    name: Typecheck — backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dinaxis/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: dinaxis/backend/node_modules
          key: ${{ runner.os }}-dinaxis-backend-${{ hashFiles('dinaxis/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dinaxis-backend-

      - name: Install backend dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

  # ── 2. Type-check frontend ─────────────────────────────────────────────────
  typecheck-frontend:
    name: Typecheck — frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: dinaxis/backend/node_modules
          key: ${{ runner.os }}-dinaxis-backend-${{ hashFiles('dinaxis/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dinaxis-backend-

      - name: Install backend dependencies (needed for @backend path alias)
        working-directory: dinaxis/backend
        run: npm ci

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: dinaxis/frontend/node_modules
          key: ${{ runner.os }}-dinaxis-frontend-${{ hashFiles('dinaxis/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dinaxis-frontend-

      - name: Install frontend dependencies
        working-directory: dinaxis/frontend
        run: npm ci

      - name: Type-check (tsc --noEmit)
        working-directory: dinaxis/frontend
        run: npx tsc -b --noEmit

  # ── 3. Build frontend ──────────────────────────────────────────────────────
  build-frontend:
    name: Build — frontend
    runs-on: ubuntu-latest
    needs: typecheck-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: dinaxis/backend/node_modules
          key: ${{ runner.os }}-dinaxis-backend-${{ hashFiles('dinaxis/backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dinaxis-backend-

      - name: Install backend dependencies (needed for @backend path alias)
        working-directory: dinaxis/backend
        run: npm ci

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: dinaxis/frontend/node_modules
          key: ${{ runner.os }}-dinaxis-frontend-${{ hashFiles('dinaxis/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dinaxis-frontend-

      - name: Install frontend dependencies
        working-directory: dinaxis/frontend
        run: npm ci

      - name: Build frontend (tsc -b && vite build)
        working-directory: dinaxis/frontend
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinaxis-frontend-dist
          path: dinaxis/frontend/dist
          retention-days: 7

