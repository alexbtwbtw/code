name: Deploy — Dinaxis

on:
  push:
    branches: [main]
    paths:
      - 'dinaxis/**'
      - 'scripts/update-nginx.sh'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires a GitHub environment named 'poc' with these variables set:
    #   AWS_ACCOUNT_ID, EC2_INSTANCE_ID, FILES_BUCKET_NAME,
    #   FRONTEND_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID, AWS_DEPLOY_ROLE_ARN
    # No SSH keys or open ports required — access is via SSM Session Manager.
    environment: poc
    if: vars.AWS_ACCOUNT_ID != ''

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
          cache-dependency-path: |
            dinaxis/backend/package-lock.json
            dinaxis/frontend/package-lock.json

      # ── Dinaxis backend ────────────────────────────────────────────────────
      - name: Install Dinaxis backend dependencies
        run: npm ci
        working-directory: dinaxis/backend

      - name: Build Dinaxis backend
        run: npm run build
        working-directory: dinaxis/backend

      - name: Package Dinaxis backend artifact
        run: |
          cd dinaxis/backend
          zip -r ../../dinaxis-backend-artifact.zip dist/ package.json package-lock.json ecosystem.config.cjs
          cd ../..
          ARTIFACT_HASH=$(sha256sum dinaxis-backend-artifact.zip | awk '{print $1}')
          echo "DINAXIS_ARTIFACT_HASH=$ARTIFACT_HASH" >> "$GITHUB_ENV"
          echo "Dinaxis artifact size: $(du -sh dinaxis-backend-artifact.zip | cut -f1)"

      # ── Sync nginx config via SSM ──────────────────────────────────────────
      - name: Sync nginx config via SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          FILES_BUCKET: ${{ vars.FILES_BUCKET_NAME }}
        run: |
          NGINX_HASH=$(sha256sum scripts/update-nginx.sh | awk '{print $1}')
          [[ "$NGINX_HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid hash"; exit 1; }
          aws s3 cp scripts/update-nginx.sh s3://${{ vars.FILES_BUCKET_NAME }}/scripts/update-nginx.sh

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e && aws s3 cp s3://${FILES_BUCKET}/scripts/update-nginx.sh /tmp/update-nginx.sh && echo '${NGINX_HASH}  /tmp/update-nginx.sh' | sha256sum -c - && bash /tmp/update-nginx.sh\"]" \
            --timeout-seconds 120 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/24] Status: $STATUS"
            case "$STATUS" in
              Success) echo "nginx sync succeeded."; break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "nginx sync failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
              *) sleep 5 ;;
            esac
            if [ "$i" -eq 24 ]; then echo "Timed out."; exit 1; fi
          done

      # ── Deploy Dinaxis backend via SSM ─────────────────────────────────────
      - name: Write Dinaxis deploy script
        run: |
          cat > dinaxis-deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e

          # Fetch config from SSM Parameter Store
          DB_PATH=$(aws ssm get-parameter \
            --name /coba/poc/dinaxis-db-path \
            --query Parameter.Value --output text)
          DINAXIS_FILES_BUCKET=$(aws ssm get-parameter \
            --name /coba/poc/dinaxis-s3-files-bucket \
            --query Parameter.Value --output text)
          # Artifact lives in the shared deploy bucket (same as COBA artifacts)
          DEPLOY_BUCKET=$(aws ssm get-parameter \
            --name /coba/poc/s3-files-bucket \
            --query Parameter.Value --output text)

          # Download artifact from S3 deploy bucket
          aws s3 cp s3://${DEPLOY_BUCKET}/deployments/dinaxis-backend-artifact.zip /tmp/dinaxis-backend-artifact.zip

          # Extract artifact
          mkdir -p /app-dinaxis /var/log/dinaxis
          cd /app-dinaxis
          unzip -o /tmp/dinaxis-backend-artifact.zip
          rm /tmp/dinaxis-backend-artifact.zip

          # Install production dependencies (node_modules not in artifact)
          npm ci --omit=dev

          # Write .env file so pm2 picks up config on every restart
          printf 'S3_FILES_BUCKET=%s\nDATABASE_URL=%s\nAWS_REGION=eu-west-2\n' \
            "$DINAXIS_FILES_BUCKET" "$DB_PATH" > /app-dinaxis/.env

          pm2 reload /app-dinaxis/ecosystem.config.cjs --update-env \
            || pm2 start /app-dinaxis/ecosystem.config.cjs

          pm2 save

          # Verify health through nginx (validates full stack)
          for attempt in $(seq 1 10); do
            if curl -sf http://localhost/dinaxis/api/health; then
              echo "Dinaxis health check passed on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Dinaxis health check failed after 10 attempts."
              pm2 logs --lines 50
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 3s..."
            sleep 3
          done
          SCRIPT

      - name: Upload Dinaxis artifact and deploy script to S3
        run: |
          DINAXIS_DEPLOY_HASH=$(sha256sum dinaxis-deploy.sh | awk '{print $1}')
          [[ "$DINAXIS_DEPLOY_HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid hash"; exit 1; }
          echo "DINAXIS_DEPLOY_HASH=$DINAXIS_DEPLOY_HASH" >> "$GITHUB_ENV"
          [[ "$DINAXIS_ARTIFACT_HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid artifact hash"; exit 1; }
          aws s3 cp dinaxis-backend-artifact.zip s3://${{ vars.FILES_BUCKET_NAME }}/deployments/dinaxis-backend-artifact.zip
          aws s3 cp dinaxis-deploy.sh s3://${{ vars.FILES_BUCKET_NAME }}/deployments/dinaxis-deploy.sh

      - name: Run Dinaxis deploy script via SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          FILES_BUCKET: ${{ vars.FILES_BUCKET_NAME }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e && aws s3 cp s3://${FILES_BUCKET}/deployments/dinaxis-deploy.sh /tmp/dinaxis-deploy.sh && echo '${DINAXIS_DEPLOY_HASH}  /tmp/dinaxis-deploy.sh' | sha256sum -c - && bash /tmp/dinaxis-deploy.sh\"]" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "[$i/60] Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Dinaxis deployment succeeded."
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Dinaxis deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac

            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for SSM command to complete."
              exit 1
            fi
          done

      # ── Build and deploy Dinaxis frontend ──────────────────────────────────
      - name: Install Dinaxis backend dependencies (needed for @backend path alias)
        run: npm ci
        working-directory: dinaxis/backend

      - name: Install Dinaxis frontend dependencies
        run: npm ci
        working-directory: dinaxis/frontend

      - name: Build Dinaxis frontend
        run: npm run build
        working-directory: dinaxis/frontend
        env:
          NODE_ENV: production

      - name: Sync Dinaxis frontend to S3
        run: |
          aws s3 sync dinaxis/frontend/dist/assets/ s3://${{ vars.FRONTEND_BUCKET_NAME }}/dinaxis/assets/ \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

          aws s3 sync dinaxis/frontend/dist/ s3://${{ vars.FRONTEND_BUCKET_NAME }}/dinaxis/ \
            --cache-control "no-cache,no-store,must-revalidate" \
            --exclude "assets/*" \
            --delete

      # ── CloudFront invalidation ────────────────────────────────────────────
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/dinaxis/index.html" "/dinaxis/*"
